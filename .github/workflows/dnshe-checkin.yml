name: DNSHE Daily Checkin

on:
  schedule:
    # GitHub Actions cron 使用 UTC。
    # 北京时间每天 08:00 = UTC 00:00
    - cron: "0 0 * * *"
  workflow_dispatch:   # 支持在 Actions 页面手动触发测试

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DNSHE checkin
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          DNSHE_GROUP_ID: ${{ secrets.DNSHE_GROUP_ID }}
          # 如果需要代理，在 Secrets 中配置 PROXY_SERVER 后取消下面注释
          # PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
        run: python checkin.py
