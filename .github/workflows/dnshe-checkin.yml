name: DNSHE Daily Checkin

on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC 时间。
    # 北京时间每天 08:00 = UTC 00:00。
    - cron: "0 0 * * *"
  workflow_dispatch:   # 支持手动触发测试

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DNSHE checkin
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          # 可选：如果 Telegram 访问受限，再配置 PROXY_SERVER
          # PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          # 可选：如果默认 @HiaiFeng 不可用，在 Secrets 中覆盖群组 ID
          # DNSHE_GROUP: ${{ secrets.DNSHE_GROUP }}
        run: python checkin.py
